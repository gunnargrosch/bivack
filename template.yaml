AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Bivack — browser terminal running coding agents in per-user AWS Lambda
  MicroVMs, with Cognito auth and per-user S3 Files home directories.

# ─────────────────────────────────────────────────────────────────────────────
# Layout of this template:
#   Parameters  — values only knowable at deploy time (see the block's own comment)
#   Networking  — VPC, NAT, subnets, NFS security group
#   Storage     — S3 buckets + the S3 Files filesystem/mount targets
#   Identity    — Cognito user pool + the IAM roles
#   Compute     — token-vending Lambda + API Gateway (Cognito-authorized)
#   Frontend    — S3 origin + CloudFront
#   Egress      — Lambda network connector (VPC egress for the MicroVMs)
#   Outputs     — everything deploy.sh / the frontend need
#
# IAM policy precedence (per the project convention): SAM policy templates first,
# then AWS managed policies, then inline. The token Lambda's permissions
# (SSM write, s3files access-point CRUD, microvm lifecycle, PassRole) have no
# matching policy template, so they are necessarily inline.
# ─────────────────────────────────────────────────────────────────────────────

Parameters:
  # Two parameters. MicrovmCodeUri is computed by deploy.sh from the microvm/
  # source on every run. LoginEmail is the first-login and budget-alert address,
  # set in deploy.env and passed by deploy.sh. Everything else that is a fixed
  # choice (image name, memory tier, capabilities, base image) is a literal on
  # the MicrovmImage resource below, not a parameter.
  LoginEmail:
    Type: String
    Default: you@example.com
    Description: >-
      Email for the first Cognito login and the monthly budget alerts. Set it
      in deploy.env; deploy.sh passes it on every deploy.
  MicrovmCodeUri:
    Type: String
    Default: ""
    Description: >-
      s3://bucket/key of the zipped microvm/ source. deploy.sh computes this
      from a content hash of the zip on every deploy — CloudFormation only
      diffs property VALUES, and unlike AWS::Serverless::Function this
      resource is NOT in SAM's local-file auto-upload list, so a content
      hash in the key is what makes a real code change actually trigger a
      rebuild instead of silently no-op'ing against a stale key. Empty only
      during the one-time bootstrap (DeployMicrovmImage=false).
  DeployMicrovmImage:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Whether to create the MicroVM image. Set "false" only for the first-ever
      deploy of a brand-new stack, which has no image artifact to pass as
      MicrovmCodeUri yet. deploy.sh always passes "true".

  # Runtime knobs. Defaults live here; set them in deploy.env and deploy.sh
  # passes them on every deploy.
  MicrovmMemoryMiB:
    Type: Number
    Default: 4096
    AllowedValues: [512, 1024, 2048, 4096, 8192]
    Description: "MicroVM memory tier (baseline MiB; bursts to 4x). From deploy.env."
  IdleMaxSeconds:
    Type: Number
    Default: 7200
    Description: "Seconds without inbound traffic before a VM suspends. From deploy.env."
  IdleSuspendSeconds:
    Type: Number
    Default: 1800
    Description: "Seconds a suspended VM stays resumable before it terminates."
  MaxLifetimeSeconds:
    Type: Number
    Default: 28800
    Description: "Hard maximum VM lifetime in seconds."
  MonthlyBudgetUsd:
    Type: Number
    Default: 25
    Description: "Monthly cost budget in USD; alerts at 80% and 100%."
  BudgetEmail:
    Type: String
    Default: ""
    Description: "Budget alert recipient. Empty skips budget creation."

  NatMode:
    Type: String
    Default: instance
    AllowedValues: [instance, gateway]
    Description: >-
      Outbound NAT for the private subnets. "instance" is a t4g.nano doing
      masquerade (~$3/month); "gateway" is a managed NAT Gateway (~$33/month).
      Set in deploy.env.

Conditions:
  DeployImage: !Equals [!Ref DeployMicrovmImage, "true"]
  UseNatInstance: !Equals [!Ref NatMode, "instance"]
  UseNatGateway: !Equals [!Ref NatMode, "gateway"]
  CreateBudget: !Not [!Equals [!Ref BudgetEmail, ""]]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 256

Resources:

  # ── Networking ──────────────────────────────────────────────────────────────
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref PublicSubnet1 }

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref PublicSubnet2 }

  # ── NAT instance (default) ───────────────────────────────────────────────────
  # A t4g.nano doing ip_forward + masquerade is ~$3/month versus ~$33 for a NAT
  # Gateway. It lives in a public subnet with an EIP, source/dest check off, and
  # the private route table points at its ENI. Set NatMode=gateway for the
  # managed NAT Gateway instead (see NatGateway below).
  NatInstanceSecurityGroup:
    Condition: UseNatInstance
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NAT instance - allow VPC-internal traffic
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: "-1"
          CidrIp: 10.0.0.0/16
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  NatInstanceRole:
    Condition: UseNatInstance
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  NatInstanceProfile:
    Condition: UseNatInstance
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref NatInstanceRole]

  NatInstanceEni:
    Condition: UseNatInstance
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref PublicSubnet1
      GroupSet: [!Ref NatInstanceSecurityGroup]
      SourceDestCheck: false
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-nat-eni" }]

  NatInstance:
    Condition: UseNatInstance
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}"
      InstanceType: t4g.nano
      IamInstanceProfile: !Ref NatInstanceProfile
      NetworkInterfaces:
        - NetworkInterfaceId: !Ref NatInstanceEni
          DeviceIndex: "0"
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -x
          # t4g.nano has 512 MB RAM and dnf can OOM mid-install; add swap first.
          dd if=/dev/zero of=/swapfile bs=1M count=512 status=none || true
          chmod 600 /swapfile || true
          mkswap /swapfile >/dev/null 2>&1 || true
          swapon /swapfile 2>/dev/null || true
          sysctl -w net.ipv4.ip_forward=1
          echo "net.ipv4.ip_forward = 1" > /etc/sysctl.d/99-nat.conf
          dnf install -y iptables || true
          # Keep the logic in a script file: inlining it in the unit's ExecStart
          # mangles the awk quoting and IFACE ends up as the whole route line.
          cat > /usr/local/bin/nat-setup.sh <<'EOS'
          #!/bin/bash
          set -e
          IFACE=$(ip route show default | awk '{print $5}' | head -1)
          echo "nat: iface=$IFACE"
          iptables -t nat -C POSTROUTING -o "$IFACE" -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -o "$IFACE" -j MASQUERADE
          EOS
          chmod +x /usr/local/bin/nat-setup.sh
          cat > /etc/systemd/system/nat.service <<'EOS'
          [Unit]
          Description=NAT masquerade
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/bin/nat-setup.sh
          [Install]
          WantedBy=multi-user.target
          EOS
          systemctl daemon-reload
          systemctl enable --now nat.service
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-nat" }]

  NatInstanceEip:
    Condition: UseNatInstance
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref NatInstance

  # Patch the NAT instance OS weekly. It is a managed SSM node (the role above
  # grants AmazonSSMManagedInstanceCore), so this needs no SSH or inbound
  # access. ApplyOnlyAtCronInterval keeps it from running at creation time.
  NatInstancePatchAssociation:
    Condition: UseNatInstance
    Type: AWS::SSM::Association
    Properties:
      Name: AWS-RunPatchBaseline
      AssociationName: !Sub "${AWS::StackName}-nat-patch"
      Targets:
        - Key: InstanceIds
          Values: [!Ref NatInstance]
      Parameters:
        Operation: [Install]
        RebootOption: [RebootIfNeeded]
      ScheduleExpression: "cron(0 3 ? * SUN *)"
      ApplyOnlyAtCronInterval: true

  # ── NAT Gateway (alternative to the NAT instance) ────────────────────────────
  NatGatewayEip:
    Type: AWS::EC2::EIP
    Condition: UseNatGateway
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: UseNatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEip.AllocationId
      SubnetId: !Ref PublicSubnet1

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [UseNatGateway, !Ref NatGateway, !Ref "AWS::NoValue"]
      NetworkInterfaceId: !If [UseNatInstance, !Ref NatInstanceEni, !Ref "AWS::NoValue"]

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PrivateRouteTable, SubnetId: !Ref PrivateSubnet1 }

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PrivateRouteTable, SubnetId: !Ref PrivateSubnet2 }

  # NFS (2049) within the VPC — S3 Files mount targets live behind this.
  NfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow NFS traffic for S3 Files mount targets
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          CidrIp: 10.0.0.0/16
      # Declare egress explicitly. Relying on the implicit default meant that
      # any later template that set SecurityGroupEgress and then removed it
      # left the group with NO egress rules (CloudFormation does not restore
      # the default), which silently killed all outbound traffic from the VM.
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  # ── Storage ─────────────────────────────────────────────────────────────────
  # Workspace bucket backs the S3 Files filesystem (per-user home directories).
  # Versioning is required by S3 Files. Retained so homes survive a stack delete.
  WorkspaceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      # Bound version growth: the CLIs churn files under the home, and every
      # write or delete leaves a version or a delete marker behind.
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 7 }
            ExpiredObjectDeleteMarker: true
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      # Build artifacts churn on each deploy; keep only recent versions.
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 7 }
            ExpiredObjectDeleteMarker: true
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  # Role S3 Files assumes to sync the bucket + manage its change-detection rules.
  # Inline: this is a service-linked-style trust policy with no policy-template equivalent.
  # Object actions use the wildcards AWS documents (s3:GetObject*/PutObject*/...)
  # rather than an enumerated list, because S3 Files calls versioned and tagging
  # variants (s3:GetObjectVersionTagging, s3:PutObjectTagging, ...) during sync.
  S3FilesRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: elasticfilesystem.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
              ArnLike: { aws:SourceArn: !Sub "arn:aws:s3files:${AWS::Region}:${AWS::AccountId}:file-system/*" }
      Policies:
        - PolicyName: BucketAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket, s3:ListBucketVersions]
                Resource: !GetAtt WorkspaceBucket.Arn
                Condition: { StringEquals: { aws:ResourceAccount: !Ref AWS::AccountId } }
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject*
                  - s3:GetObject*
                  - s3:List*
                  - s3:PutObject*
                Resource: !Sub "${WorkspaceBucket.Arn}/*"
                Condition: { StringEquals: { aws:ResourceAccount: !Ref AWS::AccountId } }
              - Effect: Allow
                Action: [events:DeleteRule, events:DisableRule, events:EnableRule, events:PutRule, events:PutTargets, events:RemoveTargets]
                Resource: arn:aws:events:*:*:rule/DO-NOT-DELETE-S3-Files*
                Condition: { StringEquals: { events:ManagedBy: elasticfilesystem.amazonaws.com } }
              - Effect: Allow
                Action: [events:DescribeRule, events:ListRuleNamesByTarget, events:ListRules, events:ListTargetsByRule]
                Resource: arn:aws:events:*:*:rule/*

  # S3 Files filesystem (NFS over the workspace bucket) + a mount target per AZ.
  # ClientToken forces replacement when changed: bump the suffix if the filesystem
  # ever needs recreating (e.g. a wedged synchronization state).
  S3FilesFileSystem:
    Type: AWS::S3Files::FileSystem
    Properties:
      Bucket: !GetAtt WorkspaceBucket.Arn
      RoleArn: !GetAtt S3FilesRole.Arn
      AcceptBucketWarning: true
      ClientToken: !Sub "${AWS::StackName}-filesystem-v2"

  S3FilesMountTarget1:
    Type: AWS::S3Files::MountTarget
    Properties:
      FileSystemId: !GetAtt S3FilesFileSystem.FileSystemId
      SubnetId: !Ref PrivateSubnet1
      SecurityGroups: [!Ref NfsSecurityGroup]

  S3FilesMountTarget2:
    Type: AWS::S3Files::MountTarget
    Properties:
      FileSystemId: !GetAtt S3FilesFileSystem.FileSystemId
      SubnetId: !Ref PrivateSubnet2
      SecurityGroups: [!Ref NfsSecurityGroup]

  # ── Identity ────────────────────────────────────────────────────────────────
  # Admin-created users only — no self-signup.
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AWS::StackName}-web"
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: hours, IdToken: hours, RefreshToken: days }

  # MicroVM build role — reads the image artifact from S3.
  # AWS managed policy for basic Lambda logging, inline for the artifact read.
  MicroVmBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { aws:SourceAccount: !Ref AWS::AccountId } }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ArtifactRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArtifactBucket.Arn

  # The MicroVM image itself, a first-class CloudFormation resource (the old
  # hand-rolled `update-microvm-image` CLI path reset the whole version config
  # on every call; as a resource the full property set is always declared).
  #
  # MinimumMemoryInMiB is a fixed-tier picker, not a free-form value. A MicroVM
  # bills at this baseline while running and bursts to 4x under load: 512 peaks
  # at 2048, 1024 at 4096, 2048 at 8192, 4096 at 16384, 8192 at 32768. Set
  # MicrovmMemoryMiB in deploy.env; 4096 is the default.
  MicrovmImage:
    Type: AWS::Serverless::MicrovmImage
    Condition: DeployImage
    Properties:
      Name: !Sub "${AWS::StackName}"
      CodeUri: !Ref MicrovmCodeUri
      BuildRoleArn: !GetAtt MicroVmBuildRole.Arn
      BaseImageArn: !Sub "arn:aws:lambda:${AWS::Region}:aws:microvm-image:al2023-1"
      BaseImageVersion: "1"
      AdditionalOsCapabilities: [ALL]
      Resources:
        - MinimumMemoryInMiB: !Ref MicrovmMemoryMiB
      EgressNetworkConnectors:
        - !Sub "arn:aws:lambda:${AWS::Region}:aws:network-connector:aws-network-connector:INTERNET_EGRESS"
      EnvironmentVariables:
        S3_FILES_FS_ID: !GetAtt S3FilesFileSystem.FileSystemId
      Hooks:
        Port: 9000
        MicrovmImageHooks:
          Ready: ENABLED
          ReadyTimeoutInSeconds: 180
          Validate: ENABLED
          ValidateTimeoutInSeconds: 300
        MicrovmHooks:
          Run: ENABLED
          RunTimeoutInSeconds: 10
          Resume: ENABLED
          ResumeTimeoutInSeconds: 10
          Suspend: ENABLED
          SuspendTimeoutInSeconds: 10
          Terminate: ENABLED
          TerminateTimeoutInSeconds: 10

  # MicroVM execution role — what the platform assumes to boot the VM, and the
  # identity the S3 Files kernel client uses via IMDS. Deliberately minimal: it
  # can mount this user's home and look up its own endpoint, nothing more. The
  # sandbox has no other AWS credentials, so IMDS is not a path to the account.
  # See README SECURITY.
  MicroVmExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { aws:SourceAccount: !Ref AWS::AccountId } }
      Policies:
        - PolicyName: SandboxBaseline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # S3 Files kernel client mount. Data isolation comes from the
              # per-user access point, not from IAM.
              - Effect: Allow
                Action: [s3files:ClientMount, s3files:ClientWrite]
                Resource: "*"
              # Self endpoint lookup in hooks.js (best-effort; the endpoint is
              # usually already in the run envelope).
              - Effect: Allow
                Action: lambda:GetMicrovm
                Resource: "*"

  # ── Compute: token-vending Lambda + API ──────────────────────────────────────
  TokenApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'GET,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        # Do NOT gate the CORS preflight (OPTIONS) behind the authorizer — the
        # browser sends OPTIONS without a token, so it must stay public.
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  TokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-token-vend"
      CodeUri: functions/token-vend/
      Handler: index.handler
      Environment:
        Variables:
          ALLOWED_ORIGINS: "*"
          IMAGE_ARN: !If [DeployImage, !GetAtt MicrovmImage.ImageArn, ""]
          EXECUTION_ROLE_ARN: !GetAtt MicroVmExecutionRole.Arn
          NETWORK_CONNECTOR_ARN: !GetAtt VpcEgressConnector.Arn
          S3_FILES_FS_ID: !GetAtt S3FilesFileSystem.FileSystemId
          SSM_PREFIX: !Sub "/${AWS::StackName}"
          IDLE_MAX_SECONDS: !Ref IdleMaxSeconds
          IDLE_SUSPEND_SECONDS: !Ref IdleSuspendSeconds
          MAX_LIFETIME_SECONDS: !Ref MaxLifetimeSeconds
      Policies:
        # SAM policy templates first:
        - SSMParameterWithSlashPrefixReadPolicy: { ParameterName: !Sub "/${AWS::StackName}/*" }
        # Then inline for permissions with no policy-template equivalent:
        - Statement:
            - Sid: SsmWritePerUserState
              Effect: Allow
              Action: [ssm:PutParameter, ssm:GetParameter, ssm:DeleteParameter]
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/*"
            - Sid: PerUserAccessPoints
              Effect: Allow
              Action: [s3files:CreateAccessPoint, s3files:GetAccessPoint, s3files:ListAccessPoints, s3files:DeleteAccessPoint]
              Resource: "*"
            - Sid: MicroVmLifecycle
              Effect: Allow
              Action: lambda:*
              Resource: "*"
              Condition: { StringEquals: { aws:RequestedRegion: !Ref AWS::Region } }
            - Sid: PassExecutionRole
              Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt MicroVmExecutionRole.Arn
      Events:
        GetToken:
          Type: Api
          Properties:
            RestApiId: !Ref TokenApi
            Path: /token
            Method: get
        TerminateVm:
          Type: Api
          Properties:
            RestApiId: !Ref TokenApi
            Path: /token
            Method: delete

  # Append index.html to directory requests so /ide/ and /cli/ work without the
  # filename (CloudFront's DefaultRootObject only covers "/").
  DirIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-dir-index"
      AutoPublish: true
      FunctionConfig:
        Runtime: cloudfront-js-2.0
        Comment: Append index.html to directory requests
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.endsWith('/')) {
            request.uri += 'index.html';
          }
          return request;
        }

  # ── Frontend: S3 + CloudFront ─────────────────────────────────────────────────
  FrontendOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Bivack frontend
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOac
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          # Compress text assets (the IDE bundle is ~12 MB uncompressed).
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DirIndexFunction.FunctionARN
          # Managed-CachingDisabled — the frontend injects live config, don't cache it.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
        CacheBehaviors:
          # Hashed IDE assets are immutable; cache them hard (Managed-CachingOptimized).
          - PathPattern: "ide/assets*"
            TargetOriginId: frontend-s3
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html }

  # Bucket policy: allow only this CloudFront distribution (via OAC) to read.
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  # ── Egress: Lambda network connector (VPC egress for MicroVMs) ────────────────
  NetworkConnectorOperatorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com, network-connectors.lambda.amazonaws.com]
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EniManagement
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:CreateNetworkInterface
                Resource:
                  - arn:aws:ec2:*:*:network-interface/*
                  - arn:aws:ec2:*:*:subnet/*
                  - arn:aws:ec2:*:*:security-group/*
              - Effect: Allow
                Action: ec2:CreateTags
                Resource: arn:aws:ec2:*:*:network-interface/*
                Condition:
                  StringEquals: { ec2:ManagedResourceOperator: network-connectors.lambda.amazonaws.com }

  VpcEgressConnector:
    Type: AWS::Lambda::NetworkConnector
    Properties:
      Name: !Sub "${AWS::StackName}-vpc-egress"
      Configuration:
        VpcEgressConfiguration:
          SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
          SecurityGroupIds: [!Ref NfsSecurityGroup]
          NetworkProtocol: IPv4
          AssociatedComputeResourceTypes: [MicroVm]
      OperatorRole: !GetAtt NetworkConnectorOperatorRole.Arn

  # ── Billing: monthly cost budget ─────────────────────────────────────────────
  # Alerts the configured admin email at 80% and 100% of the expected monthly
  # spend. The main cost drivers are MicroVM compute while running and the NAT
  # instance; the first email subscriber must confirm the subscription.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: CreateBudget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  TokenApiUrl:
    Description: Token-vending API endpoint.
    Value: !Sub "https://${TokenApi}.execute-api.${AWS::Region}.amazonaws.com/prod/token"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  LoginEmail:
    Description: The first-login address (LOGIN_EMAIL in deploy.env).
    Value: !Ref LoginEmail
  CreateUserCommand:
    Description: >-
      Fallback for creating a login by hand. deploy.sh creates the first user
      automatically; use this only to add or reset a user later.
    Value: !Sub "aws cognito-idp admin-create-user --user-pool-id ${UserPool} --username ${LoginEmail} --user-attributes Name=email,Value=${LoginEmail} Name=email_verified,Value=true --temporary-password 'YOUR_TEMP_PASSWORD'"
  FrontendUrl:
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  FrontendBucketName:
    Value: !Ref FrontendBucket
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  WorkspaceBucketName:
    Value: !Ref WorkspaceBucket
  CloudFrontDistributionId:
    Value: !Ref FrontendDistribution
  ExecutionRoleArn:
    Value: !GetAtt MicroVmExecutionRole.Arn
  NetworkConnectorArn:
    Value: !GetAtt VpcEgressConnector.Arn
  S3FilesFileSystemId:
    Value: !GetAtt S3FilesFileSystem.FileSystemId
  MicrovmImageArn:
    Condition: DeployImage
    Description: ARN of the MicroVM image (created/updated as part of this stack).
    Value: !GetAtt MicrovmImage.ImageArn
