<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bivack IDE</title>
    <link rel="icon" href="/cli/icon.svg" type="image/svg+xml" />
    <style>
      html, body {
        margin: 0; height: 100%; height: 100dvh; background: #1f1f1f; color: #cccccc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        /* Mobile browsers inflate small text (font boosting); it blows up the
           terminal's monospace and desyncs xterm's cell metrics from the render. */
        -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      }
      #workbench { height: 100vh; height: 100dvh; }
      #boot {
        position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
        gap: 14px; align-items: center; justify-content: center; background: #1f1f1f;
      }
      #boot .spin {
        width: 28px; height: 28px; border: 2px solid #3c3c3c; border-top-color: #0078d4;
        border-radius: 50%; animation: spin 0.8s linear infinite;
      }
      #boot .brand { font-size: 14px; font-weight: 600; }
      #boot .msg { color: #9d9d9d; font-size: 13px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="workbench"></div>
    <div id="boot">
      <div class="spin"></div>
      <div class="brand">Bivack</div>
      <div class="msg" id="boot-msg">Connecting to your workspace…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
